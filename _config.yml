# Site settings
title: "Melle van der Brugge - Resume"
description: "Personal resume and portfolio of Melle van der Brugge, data scientist with an MSc in Artificial Intelligence from the University of Amsterdam."
baseurl: ""
url: "https://mellevdb.github.io"

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Melle van der Brugge"
resume_title:                   "Data Scientist • MSc Artificial Intelligence"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "mellevdbrugge@gmail.com"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       ""
resume_contact_address:         "Amsterdam, Netherlands"

resume_header_contact_info:     "Amsterdam, Netherlands • mellevdbrugge@gmail.com"
display_header_contact_info:    "true"

resume_header_intro: "<p>Data scientist with an MSc in Artificial Intelligence (University of Amsterdam) and a first-author publication in <em>Photoacoustics</em>. I build AI systems that run in production and that can be checked: a retrieval-augmented (RAG) assistant for a criminal defence law firm with hybrid retrieval, cross-encoder reranking and a measured evaluation setup, and process automation on Azure at a logistics provider. Confidentiality and source-grounded output are design starting points for me rather than an afterthought: in the law firm system the separation between client files and external models is enforced in code and covered by tests. I translate technical choices into language the people using the system can act on.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "yes"

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_publications:    true
resume_section_education:       true
resume_section_projects:        true
resume_section_skills:          true
resume_section_recognition:     false
resume_section_links:           true
resume_section_associations:    false
resume_section_interests:       true

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            "https://github.com/MellevdB"
  # resume_twitter_url:           "http://twitter.com/jglovier"
  # resume_dribbble_url:          "https://dribbble.com/jag"
  # resume_facebook_url:          "insert Facebook URL here"
  resume_linkedin_url:          "https://www.linkedin.com/in/mellevdbrugge"
  resume_instagram_url:         "https://instagram.com/mellevdbrugge"
  # resume_website_url:           "http://joelglovier.com"
  # resume_medium_url:            "https://medium.com/@jglovier"
resume_print_social_links:      true

# Design settings
resume_theme:                   default

