- title: "Assessing image quality in photoacoustic imaging: A metric-based and deep learning-based evaluation"
  venue: "Photoacoustics, Volume 49, 100800"
  role: "First author"
  year: "2026"
  authors: "Melle van der Brugge, Kalloor Joseph Francis, Navchetan Awasthi"
  url: "https://doi.org/10.1016/j.pacs.2026.100800"
  doi: "10.1016/j.pacs.2026.100800"
  highlights:
    - highlight: "First large-scale benchmark of image quality assessment in photoacoustic imaging: 11 full-reference and 2 no-reference metrics evaluated across nearly one million images from five independent datasets."
    - highlight: "Trained three deep learning architectures (PAQNet, IQDCNN, EfficientNetIQA) to predict metric values directly from images, enabling reference-free quality estimation."
    - highlight: "Code published for reproducibility: github.com/MellevdB/photoacoustic-image-quality-assessment"
